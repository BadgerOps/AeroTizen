[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-tv"
version = "0.1.0"
description = "Debloat a Samsung Tizen TV, block ads, and install a clean launcher, from your computer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["websocket-client>=1.6", "cryptography>=41"]

[project.scripts]
hearth = "hearth.__main__:main"

[tool.setuptools]
packages = ["hearth"]

[tool.setuptools.package-data]
hearth = ["ca/*"]
